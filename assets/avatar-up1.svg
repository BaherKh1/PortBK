  <path d="M282 734c24 24 52 36 78 36s54-12 78-36l-22-42H304z" fill="#0f141a"/>
  <path d="M120 930c12-86 44-142 108-170-18 62-22 118-14 170z" fill="#ffffff" opacity=".035"/>
  <path d="M600 930c-12-86-44-142-108-170 18 62 22 118 14 170z" fill="#000000" opacity=".18"/>

