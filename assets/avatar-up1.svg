    <path d="M382 390c20-6 48 2 62 20" fill="none" stroke="#2a140c" stroke-width="7" stroke-linecap="round"/>
    <path d="M254 418c18 16 66 18 84 0" fill="none" stroke="#5a2d1c" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    <path d="M382 418c18 16 66 18 84 0" fill="none" stroke="#5a2d1c" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  </g>

