    <ellipse cx="296" cy="418" rx="42" ry="27" fill="#f8f0e8"/>
    <ellipse cx="424" cy="418" rx="42" ry="27" fill="#f8f0e8"/>
    <circle cx="296" cy="407" r="18" fill="#6a3d22"/>
