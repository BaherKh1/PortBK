  <path d="M338 500c8 6 14 8 22 8s14-2 22-8" fill="none" stroke="#4d2917" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <ellipse cx="334" cy="496" rx="7" ry="4" fill="#3c1e11" opacity=".6"/>
  <ellipse cx="386" cy="496" rx="7" ry="4" fill="#3c1e11" opacity=".6"/>

