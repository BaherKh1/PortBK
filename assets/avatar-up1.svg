<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960">
  <defs>
    <radialGradient id="skin" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#c98a63"/>
      <stop offset="45%" stop-color="#a96643"/>
      <stop offset="100%" stop-color="#73402a"/>
    </radialGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1108" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d241a"/>
      <stop offset="65%" stop-color="#24130d"/>
      <stop offset="100%" stop-color="#160b07"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3540"/>
      <stop offset="100%" stop-color="#161c24"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34363d"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="lips" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c5750"/>
      <stop offset="100%" stop-color="#6f3733"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e46f5a" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e46f5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b1ef4a" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#b1ef4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="360" cy="520" rx="330" ry="380" fill="url(#glow)"/>

  <!-- hair behind -->
  <g fill="url(#hair)">
