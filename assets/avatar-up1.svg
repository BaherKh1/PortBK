  <rect x="472" y="352" width="82" height="146" rx="40" fill="url(#cup)"/>
  <rect x="178" y="370" width="58" height="110" rx="29" fill="#24262c"/>
  <rect x="484" y="370" width="58" height="110" rx="29" fill="#24262c"/>
  <path d="M188 378v94" stroke="#5a5e68" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <path d="M532 378v94" stroke="#5a5e68" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <rect x="482" y="430" width="10" height="26" rx="5" fill="#b1ef4a"/>

