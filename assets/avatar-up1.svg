    <circle cx="516" cy="478" r="44"/>
    <path d="M206 320c-14 96-8 190 26 262 14 30 32 46 66 52l-38-300z"/>
    <path d="M514 320c14 96 8 190-26 262-14 30-32 46-66 52l38-300z"/>
